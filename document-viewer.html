
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sample Document Viewer</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.viewer{

    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.viewer h1{

    text-align:center;
    color:#003366;

}

.image-box{

    text-align:center;
    margin:30px 0;

}

.image-box img{

    width:100%;
    max-width:650px;
    border:2px solid #ddd;
    border-radius:10px;

}

.warning{

    background:#fff8d6;
    color:#8a5700;
    padding:15px;
    border-left:6px solid orange;
    border-radius:8px;
    margin:20px 0;

}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;   /* This centers both buttons vertically */
    gap:25px;
    margin-top:30px;
}

.buttons a{
    display:flex;
    justify-content:center;
    align-items:center;

    width:220px;
    height:60px;

    text-decoration:none;
    background:#004080;
    color:white;

    font-size:18px;
    font-weight:bold;

    border-radius:10px;

    line-height:1;        /* Prevents vertical shifting */
    white-space:nowrap;   /* Prevent text wrapping */
    vertical-align: middle;
}

.buttons a:hover{

    background:#0066cc;

}

</style>

</head>

<body>

<div class="viewer">

<h1 id="docTitle"></h1>

<div class="image-box">

<img id="docImage">

</div>

<div class="warning">

<strong>Educational Sample Only</strong><br>

This document is provided only for educational reference.
It is not an official government document.

</div>

<div class="buttons">

    <a id="downloadBtn" download>
        ⬇ Download Image
    </a>

    <a id="backBtn">← Back</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const image = params.get("image");

const title = params.get("title");

const service = params.get("service");

if(image && title){

    document.getElementById("docTitle").textContent = title;

    document.getElementById("docImage").src = image;

    document.getElementById("downloadBtn").href = image;

   document.getElementById("backBtn").addEventListener("click", () => {

    window.location.replace(
        `services-details.html?id=${service}`
    );

});

}else{

    document.body.innerHTML =
    "<h1 style='text-align:center'>Document Not Found</h1>";

}
</script>

</body>
</html>
