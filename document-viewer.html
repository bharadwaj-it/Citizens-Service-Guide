
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="View sample document images used for Sachivalayam service application guidance, with download and back navigation options." />

<title>Sample Document Viewer</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.viewer{

    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);

}

.viewer h2{

    text-align:center;
    color:#003366;

}

.image-box{

    text-align:center;
    margin:30px 0;

}

.image-box img{

    width:100%;
    max-width:650px;
    border:2px solid #ddd;
    border-radius:10px;

}

.warning{

    background:#fff8d6;
    color:#8a5700;
    padding:15px;
    border-left:6px solid orange;
    border-radius:8px;
    margin:20px 0;

}

.buttons{
    display:flex;
    justify-content:center;
    align-items:center;   /* This centers both buttons vertically */
    gap:25px;
    margin-top:30px;
}

.buttons a{
    display:flex;
    justify-content:center;
    align-items:center;

    width:220px;
    height:60px;

    text-decoration:none;
    background:#004080;
    color:white;

    font-size:18px;
    font-weight:bold;

    border-radius:10px;

    line-height:1;        /* Prevents vertical shifting */
    white-space:nowrap;   /* Prevent text wrapping */
    vertical-align: middle;
}

.buttons a:hover{

    background:#0066cc;

}

</style>

</head>

<body>

<header>
    <h1>Sachivalayam Citizen Service Guide</h1>

    <nav aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="guide.html">Guide</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>
<main>
<section class="viewer" aria-labelledby="docTitle">

    <h2 id="docTitle">Document Preview</h2>

    <div class="image-box">
        <img id="docImage" alt="Sample document preview" loading="lazy">
    </div>

    <div id="viewerError" class="viewer-error sr-only" role="alert" aria-live="assertive"></div>

    <div class="warning">
        <strong>Educational Sample Only</strong><br>
        This document is provided only for educational reference.
        It is not an official government document.
    </div>

        <button id="backBtn" type="button" class="back-btn" aria-label="Go back to the previous page">
            ← Back
        </button>
    </div>
</section>
</main>
<footer>
    <p>© 2026 Sachivalayam Citizen Service Guide</p>
    <p>Educational service guidance for citizens.</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const image = params.get("image");
const title = params.get("title");

const docTitle = document.getElementById("docTitle");
const docImage = document.getElementById("docImage");
const downloadBtn = document.getElementById("downloadBtn");
const backBtn = document.getElementById("backBtn");
const viewerError = document.getElementById("viewerError");

function showViewerError(message) {
    if (viewerError) {
        viewerError.textContent = message;
        viewerError.classList.remove("sr-only");
    }
    if (docImage) {
        docImage.style.display = "none";
    }
    if (downloadBtn) {
        downloadBtn.style.display = "none";
    }
}

if (image && title) {
    if (docTitle) {
        docTitle.textContent = title;
    }
    if (docImage) {
        docImage.src = image;
        docImage.alt = `${title} sample document image`;
        docImage.addEventListener("error", () => {
            showViewerError("Unable to load the document preview. Please try downloading the image or go back.");
        });
    }
    if (downloadBtn) {
        downloadBtn.href = image;
        downloadBtn.setAttribute("aria-label", `Download ${title} sample document`);
    }
} else {
    showViewerError("Document not found. Please use the back button to return to the previous page.");
}

if (backBtn) {
    backBtn.addEventListener("click", () => {
        history.back();
    });
}
</script>

</body>
</html>
